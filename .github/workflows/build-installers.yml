name: Build Installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: npm run build:win
            artifact_glob: dist/*.exe
          - os: macos-latest
            script: npm run build:mac
            artifact_glob: dist/*.dmg
          - os: ubuntu-latest
            script: npm run build:linux
            artifact_glob: dist/*.AppImage

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build installer
        run: ${{ matrix.script }}

      - name: Upload artifacts to Actions
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: warn

      - name: Upload to Render (if secret provided)
        if: ${{ secrets.RENDER_UPLOAD_TOKEN != '' }}
        shell: bash
        run: |
          set -e
          echo "Looking for built files: ${{ matrix.artifact_glob }}"
          FILE=$(ls ${{ matrix.artifact_glob }} 2>/dev/null | head -n1 || true)
          if [ -f "$FILE" ]; then
            echo "Uploading $FILE to Render"
            curl -s -X POST "https://sam-code.onrender.com/upload?token=${{ secrets.RENDER_UPLOAD_TOKEN }}" -F "file=@$FILE" -F "filename=$(basename $FILE)" || true
          else
            echo "No file found to upload for pattern: ${{ matrix.artifact_glob }}"
          fi
